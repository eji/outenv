name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Test
        run: nix develop -c go test -v -count=1 ./...
      - name: Build
        run: |
          nix develop -c bash -c '
            GOOS=linux  GOARCH=amd64 go build -o outenv-linux-amd64  .
            GOOS=linux  GOARCH=arm64 go build -o outenv-linux-arm64  .
            GOOS=darwin GOARCH=amd64 go build -o outenv-darwin-amd64 .
            GOOS=darwin GOARCH=arm64 go build -o outenv-darwin-arm64 .
          '
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            outenv-*
